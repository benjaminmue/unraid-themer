name: Sanitize themes

# The publish bot: any change to the theme registry is validated against the
# same ruleset the plugin uses. Unsafe or malformed submissions fail here and
# cannot be merged. Plugin sources, build.py and the generated .plg trigger it
# too, since the boot-refresh test and the XML check cover exactly those.
on:
  push:
    paths: ["themes/**", "plugin/**", "scripts/*.py", "test/**", "build.py", "unraid-themer.plg", ".github/workflows/sanitize.yml"]
  pull_request:
    paths: ["themes/**", "plugin/**", "scripts/*.py", "test/**", "build.py", "unraid-themer.plg", ".github/workflows/sanitize.yml"]

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate theme CSS + index
        run: python3 scripts/sanitize_css.py

      # The CSS rules exist twice, in Python (CI, bots) and in PHP (the plugin).
      # Both must refuse every known bypass and accept every real theme; PHP is
      # preinstalled on the runner, and --require-php fails if it ever is not.
      - name: Check the CSS rules against the attack corpus
        run: php --version && python3 test/test_css_rules.py --require-php

      # User SVGs (icon overrides, logo, background) are served from the webGui's
      # origin; the sanitiser must strip every way to run script or load content
      # and keep every bundled icon intact.
      - name: Check the SVG sanitiser against the attack corpus
        run: python3 test/test_svg_rules.py --require-php

      # Every registry entry needs a palette swatch, otherwise the store shows
      # a submitted theme without its colour preview.
      - name: Check swatches are present and current
        run: python3 scripts/gen_swatches.py --check

      # A theme whose button labels sit below WCAG AA ships unreadable buttons.
      - name: Check button label contrast
        run: python3 scripts/check_contrast.py

      # The boot script decides whether an installed theme gets refreshed or
      # left alone; getting that wrong either strands a fix or eats an edit.
      - name: Check the theme refresh logic
        run: python3 test/test_boot_refresh.py

      # The INLINE boot scripts are embedded raw, so a stray & or < in one of
      # them ships a .plg that Unraid cannot parse.
      - name: Check the plugin file is valid XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('unraid-themer.plg')"
